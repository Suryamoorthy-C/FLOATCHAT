<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1414"/>
      <stop offset="0.35" stop-color="#0d1d1d"/>
      <stop offset="0.55" stop-color="#16302a"/>
      <stop offset="0.7" stop-color="#0c1a1a"/>
      <stop offset="1" stop-color="#060d0d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6650" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2a6650" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3f9a76" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#2a6650" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a6650" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7de8b5" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#2a6650" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2a6650" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <g transform="rotate(-18 800 500)">
    <rect x="-200" y="280" width="2000" height="440" fill="url(#band)" filter="url(#soft)"/>
    <ellipse cx="800" cy="500" rx="620" ry="170" fill="url(#glow)"/>
  </g>
  <rect width="1600" height="1000" fill="#000" opacity="0.12"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
